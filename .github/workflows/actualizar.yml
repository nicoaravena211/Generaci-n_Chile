yaml
name: Actualizar datos

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      forzar:
        description: "Volver a consultar todo el histórico horario"
        type: boolean
        default: false
  push:
    paths:
      - "budgets.xlsx"

permissions:
  contents: write

concurrency:
  group: actualizar-datos
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Consultar APIs del Coordinador
        env:
          API_KEY_PRMTE: ${{ secrets.API_KEY_PRMTE }}
          API_KEY_CMG: ${{ secrets.API_KEY_CMG }}
          FORZAR: ${{ inputs.forzar }}
        run: |
          if [ "$FORZAR" = "true" ]; then
            python scripts/actualizar_datos.py --forzar
          else
            python scripts/actualizar_datos.py
          fi

      - name: Guardar datos en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "Sin cambios."
          else
            git commit -m "Actualizar datos $(date -u +%F)"
            git pull --rebase
            git push
          fi
